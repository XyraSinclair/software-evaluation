name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --all-targets --locked
      - run: cargo run --locked --bin seval-frontier -- profile . --format json > /tmp/frontier.json
      - run: |
          python3 - <<'PY'
          import json

          with open("/tmp/frontier.json", encoding="utf-8") as source:
              report = json.load(source)

          expected = [
              "reader.local-cognitive-p90",
              "reader.symbol-working-set-p90-fraction",
              "interface.shallow-function-fraction",
              "effects.syntactic-pure-fraction",
              "effects.mutable-live-range-p90-lines",
              "uniformity.reported-clone-token-density",
          ]
          assert report["schema_version"] == "seval.frontier.v1"
          assert [signal["id"] for signal in report["signals"]] == expected
          assert [receipt["id"] for receipt in report["analyzers"]] == [
              "shape", "symbols", "discipline", "duplicates"
          ]
          assert all(receipt["status"] == "complete" for receipt in report["analyzers"])
          assert all(receipt["coverage"] is not None for receipt in report["analyzers"])
          assert report["artifact"]["git"] is not None
          assert not any(
              "fell back to independent discovery" in limitation
              for limitation in report["limitations"]
          )
          PY
      - run: |
          set +e
          cargo run --locked --bin seval-frontier -- identify . . --format json > /tmp/identified.json
          code=$?
          set -e
          test "$code" -eq 0 -o "$code" -eq 1
      - run: |
          python3 - <<'PY'
          import json

          with open("/tmp/identified.json", encoding="utf-8") as source:
              report = json.load(source)

          assert report["schema_version"] == "seval.frontier.identified.v1"
          assert report["base"]["schema_version"] == "seval.frontier.v1"
          assert report["readiness"]["signal_registries_valid"] is True
          assert report["readiness"]["qualified_identified_set"] is True
          assert report["sharp_order_set"]["registry_valid"] is True
          assert report["sharp_order_set"]["complete"] is True
          assert len(report["signals"]) == 6
          PY
      - run: |
          cat > /tmp/probe-model.json <<'JSON'
          {
            "worlds": [
              { "name": "regression", "order": "left-dominates" },
              { "name": "improvement", "order": "right-dominates" },
              { "name": "mixed", "order": "tradeoff" }
            ],
            "probes": [
              {
                "name": "full-resolution",
                "cost": { "dollars": 1.0, "latency_ms": 60000, "invocations": 3 },
                "observations": { "regression": "worse", "improvement": "better", "mixed": "mixed" }
              },
              {
                "name": "cheap-screen",
                "cost": { "dollars": 0.01, "latency_ms": 500, "invocations": 1 },
                "observations": { "regression": "flagged", "improvement": "clean", "mixed": "flagged" }
              }
            ]
          }
          JSON
          cargo run --locked --bin seval-order-probes -- analyze /tmp/probe-model.json --format json > /tmp/probes.json
      - run: |
          python3 - <<'PY'
          import json

          with open("/tmp/probes.json", encoding="utf-8") as source:
              report = json.load(source)

          assert report["schema_version"] == "seval.order-probes.v1"
          assert len(report["distinct_orders"]) == 3
          assert report["prior"] is None
          # The perfect probe and the cheap screen trade information for cost:
          # neither frontier may collapse that into a verdict.
          assert report["blackwell_frontier"] == ["full-resolution", "cheap-screen"]
          assert report["order_information_frontier"] == ["full-resolution", "cheap-screen"]
          full = report["probes"][0]
          assert full["worst_case_remaining_orders"] == 1
          assert full["guaranteed_eliminated_orders"] == 2
          PY
      - run: cargo clippy --lib --bin seval-frontier --bin seval-order-probes --locked -- -D warnings
